<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>기록판</title>
<style>
  :root {
    --bg: #f4f5f7; --card-bg: #ffffff; --text: #14161a; --sub: #6b7280; --border: #e5e7eb;
    --up: #d92d20; --down: #475569; --blue: #2563eb; --accent: #059669; --warn-bg: #fef2f2; --warn: #b42318;
    --ok: #16a34a; --pend: #d97706; --na: #9ca3af; --note-bg: #f8fafc;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10; --card-bg: #15181d; --text: #f2f3f5; --sub: #9aa1ac; --border: #262a31;
      --up: #f87171; --down: #cbd5e1; --blue: #60a5fa; --accent: #34d399; --warn-bg: #1d1517; --warn: #fca5a5;
      --ok: #4ade80; --pend: #fbbf24; --na: #6b7280; --note-bg: #12151a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; padding: 22px 14px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, "Apple SD Gothic Neo", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .sub { font-size: 12px; color: var(--sub); line-height: 1.55; }
  a { color: var(--accent); }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 small { font-size: 11px; color: var(--sub); font-weight: 400; }
  .btn { border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 12.5px; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; }
  .neg { color: var(--down); } .pos { color: var(--up); }
  .row { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .row span b { font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--sub); }
  .chip b { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { padding: 7px 3px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 11.5px; color: var(--sub); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; white-space: normal; line-height: 1.3; }
  tr:last-child td { border-bottom: none; }
  .nm { white-space: normal; line-height: 1.3; }
  .note { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--note-bg); border: 1px solid var(--border); font-size: 12px; color: var(--sub); line-height: 1.6; }
  .note.warn { background: var(--warn-bg); border-color: transparent; color: var(--text); }
  .check { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .check:last-of-type { border-bottom: none; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--na); }
  .dot.ok { background: var(--ok); } .dot.no { background: var(--pend); } .dot.na { background: var(--na); }
  .check .t { font-size: 14px; font-weight: 600; }
  .check .d { font-size: 12.5px; color: var(--sub); margin-top: 2px; line-height: 1.5; }
  .tag { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; color: var(--sub); margin-left: 6px; font-weight: 400; white-space: nowrap; }
  .st-ok { color: var(--ok); } .st-no { color: var(--pend); } .st-na { color: var(--sub); }
  input { width: 64px; padding: 6px 7px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit; text-align: right; }
  details summary { cursor: pointer; font-size: 12.5px; color: var(--sub); margin-top: 10px; }
  .muted { color: var(--sub); }
  #err { margin-top: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); cursor: pointer; font-family: inherit; }
  .lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .lg.on { border-color: var(--text); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--sub); font-size: 12px; padding: 6px 11px; cursor: pointer; font-family: inherit; }
  .seg button.on { background: var(--text); color: var(--card-bg); font-weight: 700; }
  svg.ch { width: 100%; height: auto; display: block; margin-top: 8px; }
  svg.ch text { fill: var(--sub); font-size: 9.5px; font-family: inherit; }
  tr.now td { font-weight: 700; background: var(--note-bg); }
  td .s2 { display: block; font-size: 10.5px; color: var(--sub); font-weight: 400; margin-top: 1px; }
  table.cyc th, table.cyc td { padding: 7px 2px; font-size: 12.5px; }
  .ar.up { color: var(--up); } .ar.dn { color: var(--blue); }
  .idet { margin-top: 10px; padding: 12px; border-radius: 10px; background: var(--note-bg); border: 1px solid var(--border); }
  .idet .t { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .idet .d { font-size: 12.5px; color: var(--sub); margin-top: 4px; line-height: 1.55; }
  .idet .d.x { color: var(--text); }
  .irow { display: flex; gap: 8px; align-items: baseline; padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
  .irow:last-child { border-bottom: none; }
  .irow.on { background: var(--note-bg); }
  .irow .dt { flex: none; width: 62px; color: var(--sub); font-size: 11.5px; }
  .irow .tt { flex: 1; line-height: 1.35; }
  .irow .cg { flex: none; font-weight: 700; font-size: 12.5px; }
  table.mth { margin-top: 8px; table-layout: fixed; }
  table.mth th, table.mth td { padding: 5px 0; font-size: 10.5px; text-align: center; white-space: nowrap; }
  table.mth th:first-child, table.mth td:first-child { width: 58px; text-align: left; white-space: normal; line-height: 1.25; font-size: 10.5px; }
  table.mth td.hl { font-weight: 800; background: var(--note-bg); }
  table.mth tr.now td { font-weight: 700; }
  .mwrap { overflow-x: auto; }
  .mnote { font-size: 12.5px; line-height: 1.7; margin-top: 10px; }
  .mnote b { font-weight: 700; }
  .crow { padding: 10px 2px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .crow:last-of-type { border-bottom: none; }
  .crow .cy { font-size: 15px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .crow .cn { font-size: 12.5px; color: var(--sub); font-weight: 400; margin-left: 4px; }
  .crow .cref { margin-top: 6px; font-size: 11.5px; }
  .cyctog { cursor: pointer; padding: 13px 16px; user-select: none; }
  .cyctog:hover { border-color: var(--accent); }
  .lg:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>기록판</h1>
    <div style="display:flex;gap:8px;"><a class="btn" href="/" style="text-decoration:none;">← 종베</a><a class="btn" href="/crisis" style="text-decoration:none;">위기판</a><button class="btn" id="refresh">새로고침</button></div>
  </header>
  <div class="sub">코스피의 큰 상승·하락 이슈를 날짜별 화살표로 쌓아 두고, 나중에 흐름을 비교해 보는 기록입니다. 이슈와 등락의 인과를 단정하지 않고, 매수·매도를 권하지 않습니다.</div>
  <div id="iss"></div>
  <div class="card cyctog" id="cyctog" role="button" tabindex="0" aria-expanded="false"><h2 style="margin:0"><span>미국 선거 사이클 <small id="cycsub">불러오는 중…</small></span><span id="cycch" style="font-size:14px;color:var(--sub)">▸</span></h2></div>
  <div id="cycbox" hidden><div id="cal"></div><div id="mid"></div></div>
  <div id="rate"></div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n, d) { return Number(n).toLocaleString('ko-KR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function pct(n, d) { d = d == null ? 1 : d; return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(d) + '%'; }
  function apiGet(path) {
    return fetch(path, { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('로그인이 필요합니다'); }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }

  // ---------- 코스피 이슈 타임라인 ----------
  var ISS = null, issRange = 1, issTag = null, issSel = null, issMid = true, issZoom = null;   // issZoom: 드래그로 고른 [시작ms, 끝ms]   // issRange: 보여 줄 연수(0=전체, 기본 1년)
  function issT(d) { return Date.UTC(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100); }
  function usElec(y) { var d = new Date(Date.UTC(y, 10, 1)); while (d.getUTCDay() !== 1) d.setUTCDate(d.getUTCDate() + 1); d.setUTCDate(d.getUTCDate() + 1); return d.getTime(); }
  function issFmt(t) { var d = new Date(t); return String(d.getUTCFullYear()).slice(2) + '.' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '.' + ('0' + d.getUTCDate()).slice(-2); }
  function issKey(x) { return x.date + '|' + x.title; }
  function cls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : ''; }
  function arrow(x) { return '<span class="ar ' + (x.dir === 'up' ? 'up' : 'dn') + '">' + (x.dir === 'up' ? '▲' : '▼') + '</span>'; }
  function issDetail(x) {
    var after = ['5', '20', '60'].filter(function (n) { return x.after && x.after[n] != null; }).map(function (n) {
      return '<span class="chip">이후 ' + n + '거래일 <b class="' + cls(x.after[n]) + '">' + pct(x.after[n]) + '</b></span>';
    }).join('');
    var tags = (x.tags || []).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('');
    var src = (x.sources || []).filter(function (u) { return /^https?:\/\//.test(u); }).map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">출처' + (x.sources.length > 1 ? ' ' + (i + 1) : '') + '</a>';
    }).join(' · ');
    var when = x.date + (x.base && x.base !== x.date ? ' (' + x.base.slice(5) + ' 거래일 반영)' : '');
    return '<div class="idet"><div class="t">' + arrow(x) + ' ' + esc(x.title) + (x.status === 'draft' ? '<span class="tag">초안 · 출처 확인 전</span>' : x.status === 'news' ? '<span class="tag">언론 보도 기준</span>' : x.status === 'user' ? '<span class="tag">직접 기록 · 기사 미확인</span>' : '') + '</div>' +
      '<div class="d">' + esc(when) + (x.chg == null ? '' : ' · 당일 <b class="' + cls(x.chg) + '">' + pct(x.chg, 2) + '</b>') + (x.close == null ? '' : ' · 종가 ' + fmt(x.close, 2)) +
      (x.span == null ? '' : ' · 구간 <b class="' + cls(x.span) + '">' + pct(x.span) + '</b>') + '</div>' +
      (x.detail ? '<div class="d x">' + esc(x.detail) + '</div>' : '') +
      (after || tags ? '<div class="chips">' + after + tags + '</div>' : '') +
      (src ? '<div class="d">' + src + '</div>' : '') + '</div>';
  }
  function renderIss() {
    if (!ISS) { $('iss').innerHTML = ''; return; }
    var cd = ISS.closes.d, cv = ISS.closes.v, T = ISS.T, n = cd.length;
    var t1 = T[n - 1], t0 = issRange ? t1 - issRange * 365.25 * 864e5 : T[0];
    if (issZoom) { t0 = issZoom[0]; t1 = issZoom[1]; }
    var i0 = 0; while (i0 < n - 1 && T[i0] < t0) i0++;
    var iEnd = n; while (iEnd > i0 + 1 && T[iEnd - 1] > t1) iEnd--;
    t0 = (issRange || issZoom) ? t0 : T[0];
    var list = ISS.issues.filter(function (x) {
      var tb = x.base ? issT(+x.base.replace(/-/g, '')) : 0;
      return x.base && tb >= t0 && tb <= t1 && (!issTag || (x.tags || []).indexOf(issTag) >= 0);
    });
    var sel = list.filter(function (x) { return issKey(x) === issSel; })[0] || list[list.length - 1] || null;
    var W = 360, Ht = 250, L = 40, R = 8, TP = 10, B = 24;
    var lo = Infinity, hi = 0, i;
    for (i = i0; i < iEnd; i++) { if (cv[i] < lo) lo = cv[i]; if (cv[i] > hi) hi = cv[i]; }
    var lmin = Math.log(lo) - 0.1, lmax = Math.log(hi) + 0.12;
    var X = function (t) { return L + (t - t0) / (t1 - t0) * (W - L - R); };
    var Y = function (v) { return TP + (lmax - Math.log(v)) / (lmax - lmin) * (Ht - TP - B); };
    var g = '';
    if (issMid) {   // 미국 중간선거 해(2002, 2006, ...)를 옅은 띠로, 선거일(11월 첫 월요일 다음 날)을 점선으로
      for (var my = 2002; my <= new Date(t1).getUTCFullYear(); my += 4) {
        var bx0 = Math.max(t0, Date.UTC(my, 0, 1)), bx1 = Math.min(t1, Date.UTC(my + 1, 0, 1));
        if (bx1 <= bx0) continue;
        g += '<rect x="' + X(bx0).toFixed(1) + '" y="' + TP + '" width="' + Math.max(1, X(bx1) - X(bx0)).toFixed(1) + '" height="' + (Ht - TP - B) + '" fill="var(--accent)" opacity=".09"/>';
        var et = usElec(my);
        if (et >= t0 && et <= t1) g += '<line x1="' + X(et).toFixed(1) + '" x2="' + X(et).toFixed(1) + '" y1="' + TP + '" y2="' + (Ht - B) + '" stroke="var(--accent)" stroke-dasharray="2 2" stroke-width="1" opacity=".7"/>';
      }
    }
    var ticks;
    if (hi / lo > 2.2) ticks = [300, 500, 700, 1000, 1500, 2000, 3000, 4000, 5000, 7000, 10000, 15000];
    else {   // 확대 등으로 범위가 좁으면 6개 안팎이 되는 간격의 선형 눈금
      var lo2 = Math.exp(lmin), hi2 = Math.exp(lmax), stp = [10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000].filter(function (s) { return (hi2 - lo2) / s <= 6; })[0] || 5000;
      ticks = []; for (var tv = Math.ceil(lo2 / stp) * stp; tv <= hi2; tv += stp) ticks.push(tv);
    }
    ticks.forEach(function (v) {
      if (Math.log(v) < lmin || Math.log(v) > lmax) return;
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--border)" stroke-width="1"/><text x="' + (L - 4) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + fmt(v) + '</text>';
    });
    var spanY = (t1 - t0) / (365.25 * 864e5), y0 = new Date(t0).getUTCFullYear();
    if (spanY < 0.5) {
      for (var xk = 0; xk <= 4; xk++) {
        var xt = t0 + (t1 - t0) * xk / 4, xd = new Date(xt);
        g += '<text x="' + X(xt).toFixed(1) + '" y="' + (Ht - 8) + '" text-anchor="' + (xk === 0 ? 'start' : xk === 4 ? 'end' : 'middle') + '">' + issFmt(xt).slice(0) + '</text>';
      }
    } else if (spanY <= 2.5) {
      for (var yy = y0; yy <= new Date(t1).getUTCFullYear(); yy++) for (var mm = 0; mm < 12; mm += 3) {
        var tt = Date.UTC(yy, mm, 1); if (tt < t0 || tt > t1) continue;
        g += '<text x="' + X(tt).toFixed(1) + '" y="' + (Ht - 8) + '" text-anchor="middle">\'' + String(yy).slice(2) + '.' + ('0' + (mm + 1)).slice(-2) + '</text>';
      }
    } else {
      var stepY = spanY <= 9 ? 1 : spanY <= 18 ? 2 : 5;
      for (var y = y0; y <= new Date(t1).getUTCFullYear(); y++) {
        if (y % stepY) continue;
        var ty = Date.UTC(y, 0, 1); if (ty < t0 || ty > t1) continue;
        g += '<text x="' + X(ty).toFixed(1) + '" y="' + (Ht - 8) + '" text-anchor="middle">\'' + String(y).slice(2) + '</text>';
      }
    }
    var step = Math.max(1, Math.ceil((iEnd - i0) / 1200)), pts = [];
    for (i = i0; i < iEnd; i += step) pts.push(X(T[i]).toFixed(1) + ',' + Y(cv[i]).toFixed(1));
    if ((iEnd - 1 - i0) % step) pts.push(X(T[iEnd - 1]).toFixed(1) + ',' + Y(cv[iEnd - 1]).toFixed(1));
    g += '<path d="M' + pts.join('L') + '" fill="none" stroke="var(--sub)" stroke-width="1.2" stroke-linejoin="round"/>';
    var marks = '', hits = '';
    list.forEach(function (x, k) {
      var cx = X(issT(+x.base.replace(/-/g, ''))), cy = Y(x.close), on = sel && issKey(x) === issKey(sel);
      if (on) g += '<line x1="' + cx.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y1="' + TP + '" y2="' + (Ht - B) + '" stroke="var(--text)" stroke-dasharray="3 3" stroke-width="1" opacity=".5"/>';
      var s = on ? 6 : 4.5, d = x.dir === 'up' ? 1 : -1;
      marks += '<path d="M' + cx.toFixed(1) + ',' + (cy + d).toFixed(1) + 'L' + (cx - s).toFixed(1) + ',' + (cy + d * (2 * s + 1)).toFixed(1) + 'L' + (cx + s).toFixed(1) + ',' + (cy + d * (2 * s + 1)).toFixed(1) + 'Z" fill="var(' + (x.dir === 'up' ? '--up' : '--blue') + ')"' + (on ? ' stroke="var(--text)" stroke-width="1"' : '') + '/>';
      hits += '<circle class="ih" data-k="' + k + '" cx="' + cx.toFixed(1) + '" cy="' + (cy + d * 6).toFixed(1) + '" r="11" fill="transparent" style="cursor:pointer"><title>' + esc(x.date + ' ' + x.title) + '</title></circle>';
    });
    // 태그 필터
    var cnt = {};
    ISS.issues.forEach(function (x) { (x.tags || []).forEach(function (t) { cnt[t] = (cnt[t] || 0) + 1; }); });
    var midBtn = '<button class="lg' + (issMid ? ' on' : '') + '" id="imid"><i style="background:var(--accent)"></i>중간선거 해 표시</button>';
    var tagBtns = midBtn + '<button class="lg' + (!issTag ? ' on' : '') + '" data-t="">전체</button>' + Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).map(function (t) {
      return '<button class="lg' + (issTag === t ? ' on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + ' ' + cnt[t] + '</button>';
    }).join('');
    var rows = list.slice().reverse().map(function (x) {
      var k = list.indexOf(x);
      return '<div class="irow' + (sel && issKey(x) === issKey(sel) ? ' on' : '') + '" data-k="' + k + '"><span class="dt">' + esc(x.date.slice(2).replace(/-/g, '.')) + '</span><span class="tt">' + arrow(x) + ' ' + esc(x.title) + '</span><span class="cg ' + cls(x.chg) + '">' + (x.chg == null ? '' : pct(x.chg, 1)) + '</span></div>';
    }).join('');
    var seg = '<div class="seg" id="iseg">' + [[1, '1년'], [3, '3년'], [5, '5년'], [0, '전체']].map(function (r) {
      return '<button data-r="' + r[0] + '" class="' + (!issZoom && issRange === r[0] ? 'on' : '') + '">' + r[1] + '</button>';
    }).join('') + '</div>';
    seg = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + seg + (issZoom ? '<button class="btn" id="izr">확대 해제</button><span class="muted" style="font-size:12px">' + issFmt(issZoom[0]) + ' ~ ' + issFmt(issZoom[1]) + '</span>' : '') + '</div>';

      '<table class="cyc"><thead><tr><th>금리 사이클</th><th>시작 때 물가</th><th>시작 때<br>실질금리</th><th>사이클 중<br>물가 최고</th><th>끝날 때<br>물가</th></tr></thead><tbody>' + cpiRows + '</tbody></table>';
    var hkd = done.filter(function (c) { return c.dir > 0 && c.cpiStart != null; });
    var lowReal = hkd.slice().sort(function (a, b) { return a.realStart - b.realStart; })[0], bigSum = hkd.slice().sort(function (a, b) { return b.sum - a.sum; })[0];
    var mdiff = function (a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); };
    var lagTxt = hkd.filter(function (c) { return c.cpiPeak; }).map(function (c) { return ym(c.first) + ' ' + mdiff(c.cpiPeak.month, c.last.slice(0, 7)) + '개월'; }).join(', ');
    var endCpi = hkd.map(function (c) { return c.cpiEnd; }).filter(function (v) { return v != null; });
    sum = sum.replace(/<\/div>$/, '') +
      '<br>· <b>물가</b>: 인상 시작 때 실질금리(정책금리 − 물가)는 ' + hkd.map(function (c) { return ym(c.first) + ' ' + (c.realStart > 0 ? '+' : '') + c.realStart.toFixed(1); }).join(' · ') + '%p. ' +
      (lowReal && bigSum && lowReal === bigSum ? '실질금리가 가장 낮았던(가장 깊은 마이너스) 사이클이 인상 폭도 가장 컸습니다(' + ym(lowReal.first) + ', ' + lowReal.realStart.toFixed(1) + '%p → +' + bigSum.sum.toFixed(2) + '%p).' : '') +
      '<br>· 인상이 멈췄을 때 물가는 ' + (endCpi.length ? Math.min.apply(null, endCpi).toFixed(1) + ' ~ ' + Math.max.apply(null, endCpi).toFixed(1) + '%' : '-') + ', 물가 정점에서 마지막 인상까지: ' + lagTxt + '.' +
      '<br>· <b>지금</b> 물가(CPI) <b>' + Rt.cpi.now.toFixed(1) + '%</b>(' + Rt.cpi.nowMonth.slice(5) + '월, 근원 ' + (Rt.cpi.coreNow == null ? '-' : Rt.cpi.coreNow.toFixed(1)) + '%), 정책금리 ' + Rt.policy.now.toFixed(2) + '% → 실질금리 <b>' + ((Rt.policy.now - Rt.cpi.now) > 0 ? '+' : '') + (Rt.policy.now - Rt.cpi.now).toFixed(1) + '%p</b>.</div>';
    var epRows = ep.map(function (e) { return '<tr><td>' + ym6(e.from) + '→' + ym6(e.to) + '</td><td>' + e.y10From.toFixed(2) + '→' + e.y10To.toFixed(2) + '</td><td class="' + cls(e.kospi) + '">' + sgn(e.kospi, 1) + '</td><td class="' + cls(e.next3m) + '">' + sgn(e.next3m, 1) + '</td></tr>'; }).join('');
    var status = '정책금리(목표 상단) <b>' + Rt.policy.now.toFixed(2) + '%</b>(' + Rt.policy.nowDate.slice(5) + ' 기준), 미 10년물 <b>' + Rt.y10.now.toFixed(2) + '%</b>(' + Rt.y10.nowDate.slice(5) + ' 기준), 물가(CPI) <b>' + Rt.cpi.now.toFixed(1) + '%</b>(' + Rt.cpi.nowMonth.slice(5) + '월, 근원 ' + (Rt.cpi.coreNow == null ? '-' : Rt.cpi.coreNow.toFixed(1)) + '%)' + (Rt.ndq ? ', 나스닥 <b>' + fmt(Rt.ndq.now, 0) + '</b>(' + Rt.ndq.nowDate.slice(5) + ' 미국 종가).' : '.');
    $('rate').innerHTML = '<div class="card"><h2>미국 금리와 코스피<small>' + esc(Rt.asOf.slice(5)) + ' 기준</small></h2>' +
      '<div class="note" style="margin-top:0">' + status + '</div>' + '<div style="margin-top:10px">' + seg + '</div>' +
      '<svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="코스피·나스닥과 미국 정책금리·10년물·물가">' + g + '</svg>' + '<div class="sub" style="margin-top:4px">차트를 드래그하면 그 기간만 확대합니다(더블클릭하면 되돌림). 나스닥은 보이는 기간의 첫날에 코스피와 같은 값으로 맞춰 그려서, 같은 등락률이면 같은 높이입니다(세로 눈금은 코스피 기준).</div>' + leg +
      '<table class="cyc"><thead><tr><th>금리 사이클</th><th>정책금리(%)</th><th>코스피<br>구간 수익</th><th>구간 중<br>최대낙폭</th><th>첫 결정<br>후 6개월</th><th>후 12개월</th></tr></thead><tbody>' + rows + '</tbody></table>' + cpiTab + sum +
      '<details><summary>10년물 급등 ' + ep.length + '번 보기</summary><table class="cyc"><thead><tr><th>기간(월말)</th><th>10년물(%)</th><th>코스피<br>같은 기간</th><th>이후<br>3개월</th></tr></thead><tbody>' + epRows + '</tbody></table></details>' +
      '<div class="note">표본이 적고(인상·인하 사이클 각 4번) 환율·위험선호·경기 등 다른 요인이 섞여 있어 금리가 코스피를 움직였다고 단정하지 않으며, 매수·매도를 권하지 않습니다. 10년물 하락은 경기침체·위기 때도 나타나므로 "금리 하락 = 호재"로 읽을 수 없습니다. 사이클은 같은 방향의 금리 결정을 365일 안에서 묶었고(방향이 바뀌면 새 사이클), 인하 구간의 코스피 수익은 첫 결정일~마지막 결정일 종가 기준입니다. 결정일은 FRED의 목표금리 변경일이라 미국 현지 결정일과 하루 차이가 날 수 있습니다. 물가는 미 소비자물가지수(CPI, 계절조정)의 전년 동월 대비로 해당 월 기준이라 실제 발표(다음 달 중순)보다 앞선 시점에 그려지고, 결정일에는 직전 월 물가를 썼습니다. 실질금리는 단순 계산(정책금리 − 물가)입니다. 나스닥은 나스닥 종합지수의 미국 현지 종가(FRED 제공이라 반영이 며칠 늦음)이고, 한국 날짜와는 하루 차이가 납니다. 출처: FRED(DFEDTAR·DFEDTARU·DGS10·CPIAUCSL·CPILFESL·NASDAQCOM).</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('#rleg button'), function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-k'); rateShow[k] = !rateShow[k]; renderRate(); }); });
    Array.prototype.forEach.call(document.querySelectorAll('#rseg button'), function (b) { b.addEventListener('click', function () { rateRange = +b.getAttribute('data-r'); rateZoom = null; renderRate(); }); });
    // 드래그로 기간 확대(서버 호출 없이 이미 받은 데이터로 다시 그림)
    var sv = document.querySelector('#rate svg.ch'), dr = null;
    sv.style.touchAction = 'pan-y'; sv.style.cursor = 'crosshair';
    var vx = function (ev) { var rc = sv.getBoundingClientRect(); return (ev.clientX - rc.left) / rc.width * W; };
    sv.addEventListener('pointerdown', function (ev) { if (ev.button > 0) return; dr = { x0: vx(ev), x1: vx(ev), on: false, id: ev.pointerId }; });
    sv.addEventListener('pointermove', function (ev) {
      if (!dr) return;
      dr.x1 = vx(ev);
      if (!dr.on && Math.abs(dr.x1 - dr.x0) > 4) { dr.on = true; try { sv.setPointerCapture(dr.id); } catch (e) { } }
      if (!dr.on) return;
      var rc = sv.querySelector('#rsel');
      if (!rc) {
        rc = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); rc.setAttribute('id', 'rsel'); rc.setAttribute('y', topT); rc.setAttribute('height', botB - topT);
        rc.setAttribute('fill', 'var(--accent)'); rc.setAttribute('opacity', '.22'); rc.style.pointerEvents = 'none'; sv.appendChild(rc);
      }
      var a = Math.max(L, Math.min(dr.x0, dr.x1)), b = Math.min(W - Rg, Math.max(dr.x0, dr.x1));
      rc.setAttribute('x', a); rc.setAttribute('width', Math.max(0, b - a));
    });
    sv.addEventListener('pointerup', function () {
      if (!dr) return;
      var d = dr; dr = null;
      if (!d.on) return;
      var a = Math.max(L, Math.min(d.x0, d.x1)), b = Math.min(W - Rg, Math.max(d.x0, d.x1));
      var ta = t0 + (a - L) / (W - L - Rg) * (t1 - t0), tb = t0 + (b - L) / (W - L - Rg) * (t1 - t0);
      if (tb - ta >= 30 * 864e5) rateZoom = [ta, tb];   // 30일보다 좁게 고르면 무시(10년물이 주간 값이라)
      renderRate();
    });
    sv.addEventListener('pointercancel', function () { dr = null; });
    sv.addEventListener('dblclick', function () { if (rateZoom) { rateZoom = null; renderRate(); } });
    if ($('rzr')) $('rzr').addEventListener('click', function () { rateZoom = null; renderRate(); });
  }
  function loadRate() {
    apiGet('/api/record/rates').then(function (j) { RATE = j; renderRate(); }).catch(function (e) {
      RATE = null; $('rate').innerHTML = '<div class="card"><h2>미국 금리와 코스피</h2><div class="note warn">불러오지 못했습니다: ' + esc(e.message) + '</div></div>';
    });
  }

  $('refresh').addEventListener('click', function () { loadIss(); loadMid(); loadRate(); });
  loadIss();
  loadMid();
  loadRate();
})();
</script>
</body>
</html>
