<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>위기 상황판</title>
<style>
  :root {
    --bg: #f4f5f7; --card-bg: #ffffff; --text: #14161a; --sub: #6b7280; --border: #e5e7eb;
    --up: #d92d20; --down: #475569; --accent: #059669; --warn-bg: #fef2f2; --warn: #b42318;
    --ok: #16a34a; --pend: #d97706; --na: #9ca3af; --note-bg: #f8fafc;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10; --card-bg: #15181d; --text: #f2f3f5; --sub: #9aa1ac; --border: #262a31;
      --up: #f87171; --down: #cbd5e1; --accent: #34d399; --warn-bg: #1d1517; --warn: #fca5a5;
      --ok: #4ade80; --pend: #fbbf24; --na: #6b7280; --note-bg: #12151a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; padding: 22px 14px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, "Apple SD Gothic Neo", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .sub { font-size: 12px; color: var(--sub); line-height: 1.55; }
  a { color: var(--accent); }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 small { font-size: 11px; color: var(--sub); font-weight: 400; }
  .btn { border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 12.5px; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; }
  .neg { color: var(--down); } .pos { color: var(--up); }
  .row { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .row span b { font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--sub); }
  .chip b { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { padding: 7px 3px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 11.5px; color: var(--sub); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; white-space: normal; line-height: 1.3; }
  tr:last-child td { border-bottom: none; }
  .nm { white-space: normal; line-height: 1.3; }
  .note { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--note-bg); border: 1px solid var(--border); font-size: 12px; color: var(--sub); line-height: 1.6; }
  .note.warn { background: var(--warn-bg); border-color: transparent; color: var(--text); }
  .check { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .check:last-of-type { border-bottom: none; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--na); }
  .dot.ok { background: var(--ok); } .dot.no { background: var(--pend); } .dot.na { background: var(--na); }
  .check .t { font-size: 14px; font-weight: 600; }
  .check .d { font-size: 12.5px; color: var(--sub); margin-top: 2px; line-height: 1.5; }
  .tag { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; color: var(--sub); margin-left: 6px; font-weight: 400; white-space: nowrap; }
  .st-ok { color: var(--ok); } .st-no { color: var(--pend); } .st-na { color: var(--sub); }
  input { width: 64px; padding: 6px 7px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit; text-align: right; }
  .over { color: var(--up); font-weight: 700; } .under { color: var(--ok); }
  details summary { cursor: pointer; font-size: 12.5px; color: var(--sub); margin-top: 10px; }
  .muted { color: var(--sub); }
  #err { margin-top: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); cursor: pointer; font-family: inherit; }
  .lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .lg.on { border-color: var(--text); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--sub); font-size: 12px; padding: 6px 11px; cursor: pointer; font-family: inherit; }
  .seg button.on { background: var(--text); color: var(--card-bg); font-weight: 700; }
  svg.ch { width: 100%; height: auto; display: block; margin-top: 8px; }
  svg.ch text { fill: var(--sub); font-size: 9.5px; font-family: inherit; }
  tr.now td { font-weight: 700; background: var(--note-bg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>위기 상황판</h1>
    <div style="display:flex;gap:8px;"><a class="btn" href="/" style="text-decoration:none;">← 종베</a><button class="btn" id="refresh">새로고침</button></div>
  </header>
  <div class="sub">코스피가 지금 위기의 어디쯤인지 보여 주는 상태판입니다. 사실 계산과 과거 검증 결과만 표시하고, 매수·매도를 권하지 않습니다. 손절 계산기는 <a href="/risk">/risk</a></div>
  <div id="err"></div>
  <div id="pos"></div>
  <div id="chk"></div>
  <div id="hist"></div>
  <div id="disp"></div>
  <div id="mgn"></div>
  <div id="cred"></div>
  <div id="scn"></div>
  <div class="sub" style="margin-top:18px">자료: 코스피 일봉(네이버), 미국 신용 스프레드(FRED, 하루 1회 갱신·미국 영업일 기준 하루 늦음). 보유 종목은 이 기기의 손절 계산기 입력값을 읽으며 서버로 보내지 않습니다.</div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n, d) { return Number(n).toLocaleString('ko-KR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function pct(n, d) { d = d == null ? 1 : d; return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(d) + '%'; }
  function md(s) { return s ? s.slice(5) : ''; }
  function num(s) { var v = parseFloat(String(s == null ? '' : s).replace(/,/g, '')); return isFinite(v) ? v : NaN; }
  var D = null;               // /api/crisis 응답
  var prices = {};            // code -> 현재가 (보유 종목)

  function apiGet(path) {
    return fetch(path, { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('로그인이 필요합니다'); }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }

  // ---------- 1. 현재 위치 ----------
  function renderPos() {
    var d = D, sp = d.speed;
    function spChip(k) {
      var v = sp[k];
      return '<span class="chip">-' + k + '% <b>' + (v ? v.days + '거래일' : '미도달') + '</b></span>';
    }
    var rows = d.lows.map(function (l) {
      var re = l.confirmed ? '<span class="pos">' + pct(l.reboundPct) + '</span>' : '<span class="muted">진행 중</span>';
      return '<tr><td>' + l.n + '차' + (l.confirmed ? '' : ' <span class="tag">현재</span>') + '</td><td>' + md(l.date) + '</td><td>' + fmt(l.close, 2) + '</td><td class="neg">' + pct(l.dd) + '</td><td>' + re + '</td></tr>';
    }).join('');
    var low = d.lowestClose, ma = d.ma, cur = d.last.close;
    var maRow = ['ma20', 'ma60', 'ma120'].map(function (k) {
      var g = (cur / ma[k] - 1) * 100;
      return '<span>' + k.replace('ma', '') + '일선 <b>' + fmt(ma[k]) + '</b> <span class="' + (g >= 0 ? 'pos' : 'neg') + '">(' + pct(g) + ')</span></span>';
    }).join('');
    var since = low.newLowToday ? '<b>오늘 신저점</b>' : '최저 종가(' + md(low.date) + ') 이후 <b>' + low.tradingDaysSince + '거래일</b>';
    var vs = d.vsPrevLow ? '<span>' + (d.lows[d.lows.length - 1].n) + '차 저점은 ' + d.vsPrevLow.prevN + '차 저점 대비 <b class="' + (d.vsPrevLow.pct < 0 ? 'neg' : 'pos') + '">' + pct(d.vsPrevLow.pct) + '</b></span>' : '';
    var reb = d.mode === 'up' ? '<span>직전 저점에서 <b class="pos">' + pct(d.reboundFromLow) + '</b> 반등 중</span>' : '';
    $('pos').innerHTML = '<div class="card"><h2>현재 위치<small>' + esc(d.last.date) + (d.liveToday ? ' 장중 현재가' : ' 종가') + '</small></h2>' +
      '<div class="big neg">' + pct(d.drawdown, 1) + '</div>' +
      '<div class="row"><span>고점 <b>' + fmt(d.peak.close, 2) + '</b> (' + md(d.peak.date) + ')</span><span>현재 <b>' + fmt(cur, 2) + '</b></span><span>고점 후 ' + d.tradingDaysSincePeak + '거래일</span></div>' +
      '<div class="chips">' + spChip('20') + spChip('30') + spChip('40') + '</div>' +
      '<table><tr><th>저점</th><th>날짜</th><th>종가</th><th>고점 대비</th><th>이후 반등</th></tr>' + rows + '</table>' +
      '<div class="row">' + vs + reb + '<span>' + since + '</span></div>' +
      '<div class="row">' + maRow + '</div>' +
      '<div class="note">저점은 15% 반등으로 확정한 지그재그 기준입니다. 진행 중인 저점은 더 내려가면 바뀝니다. 장중에는 오늘 값이 현재가라서 종가와 다를 수 있습니다.</div></div>';
  }

  // ---------- 2. 반등 확인 체크리스트 ----------
  var EVI = { backtest: '앞서 백테스트', backtest2: '백테스트(보통)', weak: '검증 결과 약함' };
  function renderChk() {
    var items = D.checklist, ok = items.filter(function (c) { return c.status === 'ok'; }).length, na = items.filter(function (c) { return c.status === 'na'; }).length;
    var st = { ok: '충족', no: '미충족', na: '해당 없음' };
    var rows = items.map(function (c) {
      return '<div class="check"><span class="dot ' + c.status + '"></span><div><div class="t">' + esc(c.title) + ' <span class="st-' + c.status + '">' + st[c.status] + '</span><span class="tag">' + esc(EVI[c.evidence] || '') + '</span></div><div class="d">' + esc(c.text) + '</div></div></div>';
    }).join('');
    $('chk').innerHTML = '<div class="card"><h2>반등 확인 체크리스트<small>' + ok + '/' + (items.length - na) + ' 충족</small></h2>' + rows +
      '<div class="note">앞의 두 항목은 "60거래일 신저점 없음 + 종가가 60일선 위"로 코스피 과거 위기를 백테스트한 규칙입니다. 모든 칸이 켜져도 확정이 아니라 확률이 올라간다는 뜻입니다.</div>' +
      '<details><summary>20일선·2차 저점·신용 항목 검증 결과 보기</summary>' +
      '<div class="note"><b>검증 방법</b>: 코스피 1990~2026, 직전 400일 고점 대비 -25% 이하인 날(약 1,600일, 서로 다른 위기 구간 약 12개)에서 항목 조건을 만족한 뒤 60·120거래일 동안 지금까지의 최저 종가를 다시 깼는지 봤습니다. 겹치는 날은 40거래일 이내를 한 묶음으로 세었습니다.</div>' +
      '<div class="note"><b>20일선 (백테스트 보통)</b>: "신저점 없이 10거래일 + 종가가 20일선 위"인 날은 이후 60일 안에 신저점을 다시 만든 비율이 19%(묶음 기준 21%)였고, 20일선 아래인 날은 47%(묶음 73%)였습니다. 그런데 이후 최대 추가 낙폭 중앙값은 -11%로 거의 같았습니다. 신저점 재발 확률은 낮추지만 -10% 안팎의 흔들림은 막지 못합니다. 20일선을 막 돌파한 날만 따로 뽑아도 19%로 같아서, 돌파라는 사건보다 "20일선 위에서 신저점 없이 10일"이라는 상태가 구분력을 가졌습니다.</div>' +
      '<div class="note"><b>2차 저점 지지 (검증 결과 약함)</b>: 진행 중 저점이 직전 저점 -3% 이내이고 10거래일 신저점이 없었던 날의 60일 내 신저점 재발은 32%(묶음 40%), 3% 넘게 이탈한 날은 76%(묶음 71%)였습니다. 다만 독립 표본이 7~10건뿐이고, "신저점 없이 10일 경과"만 만족한 대조군(34%)과 지지 쪽이 같아서 지지가 따로 알려 주는 건 없고, 이탈이 나쁜 신호에 가깝습니다. 기준을 20일로 늘리면 차이가 사라집니다.</div>' +
      '<div class="note"><b>신용 스프레드 꺾임 (검증 결과 약함)</b>: 아래 신용 스프레드 칸의 설명을 보세요.</div></details></div>';
  }


  // ---------- 2-2. 과거 위기 겹쳐 보기 ----------
  var HIST = null, hMode = 'peak', hHl = null;
  var HCOL = ['#3b82f6', '#a855f7', '#14b8a6', '#eab308', '#ec4899', '#84cc16', '#06b6d4', '#f97316', '#94a3b8'];
  function hLabel(e) { var t = e.troughDate; return "'" + t.slice(2, 4) + '.' + t.slice(5, 7) + (e.name ? ' ' + e.name : ''); }
  function curNow() {
    // 지금 위기를 과거 위기와 같은 모양으로: 고점 후 일수, -30% 도달 일수, -30% 이후 진행 중 저점
    var c = D.curve, n = c.length, d30 = D.speed['30'] ? D.speed['30'].days : null, low = 0, lowI = 0;
    for (var i = 0; i < n; i++) if (c[i] < c[lowI]) lowI = i;
    var o = { curve: c, days: n - 1, d30: d30, troughDd: c[lowI], daysToTrough: lowI };
    if (d30 != null) {
      var mi = d30; for (var j = d30; j < n; j++) if (c[j] < c[mi]) mi = j;
      o.after30Days = mi - d30; o.extra = ((1 + c[mi] / 100) / (1 + c[d30] / 100) - 1) * 100; o.since30 = n - 1 - d30;
    }
    return o;
  }
  function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }
  function renderHist() {
    if (!HIST) { $('hist').innerHTML = ''; return; }
    var eps = HIST.episodes, now = curNow(), W = 360, Ht = 250, L = 34, R = 8, T = 10, B = 26;
    var xmax = hMode === 'peak' ? 330 : 300, ymax = hMode === 'peak' ? 0 : -20, ymin = -70;
    var X = function (k) { return L + k / xmax * (W - L - R); };
    var Y = function (v) { return T + (ymax - v) / (ymax - ymin) * (Ht - T - B); };
    var g = '';
    for (var yv = ymax === 0 ? 0 : -30; yv >= ymin; yv -= 10) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(yv) + '" y2="' + Y(yv) + '" stroke="var(--border)" stroke-width="1"/><text x="' + (L - 4) + '" y="' + (Y(yv) + 3) + '" text-anchor="end">' + yv + '%</text>';
    for (var xv = 0; xv <= xmax; xv += 60) g += '<text x="' + X(xv) + '" y="' + (Ht - 10) + '" text-anchor="middle">' + xv + '</text>';
    g += '<text x="' + (W - R) + '" y="' + (Ht - 1) + '" text-anchor="end">' + (hMode === 'peak' ? '고점 후 거래일' : '-30% 도달 후 거래일') + '</text>';
    if (hMode === 'd30') g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(-30) + '" y2="' + Y(-30) + '" stroke="var(--sub)" stroke-dasharray="3 3" stroke-width="1"/>';
    var path = function (curve, off) {
      var pts = [];
      for (var i = 0; i < curve.length; i++) { var k = i - off; if (k < 0 || k > xmax) continue; pts.push(X(k).toFixed(1) + ',' + Y(curve[i]).toFixed(1)); }
      return pts.length > 1 ? 'M' + pts.join('L') : '';
    };
    var dim = function (id) { return hHl && hHl !== id ? 0.15 : 1; };
    g += '<clipPath id="hc"><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (Ht - T - B) + '"/></clipPath><g clip-path="url(#hc)">';
    eps.forEach(function (e, i) {
      var off = hMode === 'peak' ? 0 : e.daysTo30, pd = path(e.curve, off);
      if (!pd) return;
      var col = HCOL[i % HCOL.length], tk = (hMode === 'peak' ? e.daysToTrough : e.daysFrom30ToTrough);
      g += '<path d="' + pd + '" fill="none" stroke="' + col + '" stroke-width="' + (hHl === e.id ? 2.4 : 1.4) + '" opacity="' + dim(e.id) + '"/>';
      if (tk <= xmax) g += '<circle cx="' + X(tk) + '" cy="' + Y(Math.max(ymin, e.troughDd)) + '" r="2.6" fill="' + col + '" opacity="' + dim(e.id) + '"/>';
    });
    var nowOff = hMode === 'peak' ? 0 : now.d30;
    if (hMode === 'peak' || now.d30 != null) {
      var pn = path(now.curve, nowOff);
      var ex = hMode === 'peak' ? now.days : now.since30;
      g += '<path d="' + pn + '" fill="none" stroke="var(--text)" stroke-width="3" opacity="' + dim('now') + '"/>' +
           '<circle cx="' + X(ex) + '" cy="' + Y(Math.max(ymin, now.curve[now.curve.length - 1])) + '" r="4" fill="var(--text)" stroke="var(--card-bg)" stroke-width="1.5"/>';
    }
    g += '</g>';
    var legend = eps.map(function (e, i) {
      return '<button class="lg' + (hHl === e.id ? ' on' : '') + '" data-id="' + e.id + '"><i style="background:' + HCOL[i % HCOL.length] + '"></i>' + esc(hLabel(e)) + '</button>';
    }).join('') + '<button class="lg' + (hHl === 'now' ? ' on' : '') + '" data-id="now"><i style="background:var(--text)"></i>지금</button>';
    // 표
    var rows = eps.map(function (e) {
      return '<tr><td>' + esc(hLabel(e)) + '<br><span class="muted">고점 ' + e.peakDate.slice(2, 7).replace('-', '.') + '</span></td><td class="neg">' + pct(e.troughDd) + '</td><td>' + e.daysTo30 + '일</td><td>' + e.daysFrom30ToTrough + '일 · ' + pct(e.extraAfter30, 0) + '</td><td>' + (e.recoveryDays == null ? '미회복' : e.recoveryDays + '일') + '</td></tr>';
    }).join('');

  // ---------- 2-3. 이평선 이격도 ----------
  function pctile(v, q) {
    // q: [[백분위, 값], ...] 값 오름차순. v 이하였던 위기일 비율(%)을 보간해서 반환
    if (!q || !q.length) return null;
    if (v <= q[0][1]) return q[0][0];
    for (var i = 1; i < q.length; i++) {
      if (v <= q[i][1]) { var a = q[i - 1], b = q[i]; return b[1] === a[1] ? b[0] : a[0] + (b[0] - a[0]) * (v - a[1]) / (b[1] - a[1]); }
    }
    return q[q.length - 1][0];
  }

      var pos = pc == null ? '' : (v < 0 ? '하위 ' + (pc < 1 ? '1% 이내' : Math.round(pc) + '% 이내') : '위기 중 ' + Math.round(pc) + '% 선');
      return '<tr><td>' + names[k] + '</td><td class="' + (v < 0 ? 'neg' : 'pos') + '">' + pct(v) + '</td><td>' + pos + '</td></tr>';
    }).join('');

      '<table><thead><tr><th>이평선</th><th>이격도</th><th>위기 구간 중 위치</th></tr></thead><tbody>' + rows + '</tbody></table>';
    if (dsp) {
      var st = dsp.stats20, cur = dp.ma20, sel = null;
      st.forEach(function (r) { if (r.th != null && cur <= r.th) sel = r; });   // 가장 깊은 해당 기준
      var body = st.map(function (r) {

      if (sel) {
        html += '<div class="note">지금 20일 이격도 <b>' + pct(cur) + '</b>는 위 표의 <b>' + sel.label + '</b> 구간입니다. 이런 날 이후 5일 안에 오른 비율은 ' + sel.up5 + '%(전체 ' + st[0].up5 + '%), 20일 안에 신저점을 다시 만든 비율은 <b>' + sel.newLow20 + '%</b>(전체 ' + st[0].newLow20 + '%)였습니다. 겹치는 날을 묶은 독립 사건 ' + sel.clusters + '건만 세면 5일 뒤 상승 ' + sel.cUp5 + '건, 10일 뒤 상승 ' + sel.cUp10 + '건, 20일 안 신저점 ' + sel.cNewLow20 + '건입니다.</div>';

        var loss = H.basis === 'cur' ? x.cur : Math.max(0, x.vsAvg);
        if (!x.ok) return '<td>-</td>';
        return '<td class="' + (loss > lim ? 'over' : 'under') + '">' + (loss > lim ? '초과<br>+' + fmt(loss - lim) : '여유<br>' + fmt(lim - loss)) + '</td>';
      }).join('') + '</tr>';
    }
    $('scn').innerHTML = '<div class="card"><h2>내 포지션 시나리오<small>코스피 ' + fmt(idx, 2) + ' 기준</small></h2>' +
      '<div class="sub">지수가 지금보다 더 내려가면 보유 종목이 얼마나 빠지는지 계산합니다. 민감도는 지수가 1% 움직일 때 종목이 움직이는 배수(직접 수정)입니다.</div>' +
      '<table><tr><th>종목</th><th>평가금(원)</th><th>민감도(배)</th></tr>' + rows + '</table>' +
      '<table><tr><th>지수가</th>' + head + '</tr>' +
      '<tr><td>추가 손실<br><span class="muted">(현재가 대비)</span></td>' + lineCur + '</tr>' +
      '<tr><td>평단 대비<br><span class="muted">손익 합계</span></td>' + lineAvg + '</tr>' + lineLim + '</table>' +
      '<div class="note">단순 배수 계산이라 매도 비용은 빠져 있습니다. 레버리지·인버스 ETF는 일일 수익률의 배수라서 며칠에 걸친 등락에서는 단순 배수와 달라집니다(변동성 손실). 코스닥 종목·ETF는 코스피와 같이 움직이는 정도가 달라 민감도를 직접 정하세요.</div></div>';
    $('scn').querySelectorAll('input').forEach(function (el) {
      el.addEventListener('change', function () {
        var v = parseFloat(el.value.replace(',', '.'));
        if (isFinite(v)) beta[el.dataset.code] = v; else delete beta[el.dataset.code];
        saveBeta(); renderScn();
      });
    });
  }

  function load() {
    $('err').innerHTML = '';
    apiGet('/api/crisis').then(function (d) {
      D = d; renderPos(); renderChk(); renderCred(); renderMargin();
      apiGet('/api/crisis/history').then(function (h) { HIST = h; renderHist(); renderDisp(); }).catch(function () { HIST = null; $('hist').innerHTML = ''; renderDisp(); });
      var H = holdings();
      renderScn();
      loadPrices(H.list).then(renderScn);
    }).catch(function (e) { $('err').innerHTML = '<div class="note warn">불러오지 못했습니다: ' + esc(e.message) + '</div>'; });
  }
  $('refresh').addEventListener('click', load);
  loadBeta();
  load();
})();
</script>
</body>
</html>
