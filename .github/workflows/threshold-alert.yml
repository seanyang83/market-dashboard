name: Check threshold alert

# Every 30 min from 09:00 to 20:00 KST, checks whether 매크로/종목 체크 % has
# newly crossed 80% (up) or 20% (down, with 20%p hysteresis on both). Only
# sends a Telegram message when a crossing actually happened - stays silent
# otherwise, independent of the fixed-checkpoint summary schedule. The
# server also enforces the 09:00-20:00 window itself.
on:
  schedule:
    - cron: "*/30 0-10 * * 1-5"  # 09:00-19:30 KST, Mon-Fri
    - cron: "0 11 * * 1-5"       # 20:00 KST, Mon-Fri
  workflow_dispatch: {}

# 무료 Render 서버는 15분 무접속이면 잠들고 깨어나는 데 ~1분 걸려서, 타임아웃을
# 90초로 늘리고 실패 시 20초 간격으로 3번 재시도한다(발송 누락 방지).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check threshold alert
        run: |
          curl -sf -m 90 --retry 3 --retry-delay 20 --retry-all-errors "https://market-dashboard-gqxq.onrender.com/api/telegram/check-alert?key=${{ secrets.TELEGRAM_SUMMARY_KEY }}"
