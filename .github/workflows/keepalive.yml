name: Keep dashboard awake

# Render's free tier spins the app down after ~15 min of no traffic, which
# makes the next real visit wait through a cold start. Ping it every 10 min
# during Korean market hours so it stays warm.
on:
  schedule:
    # 08:50-15:59 KST, Mon-Fri (cron times are UTC)
    - cron: "50 23 * * 0-4"
    - cron: "*/10 0-6 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: curl -sf -o /dev/null -m 20 "https://market-dashboard-gqxq.onrender.com/" || true
