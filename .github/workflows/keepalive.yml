name: Keep dashboard awake

# Render's free tier spins the app down after ~15 min of no traffic, which
# makes the next real visit wait through a cold start. Ping it every 10 min
# during Korean market hours so it stays warm.
on:
  schedule:
    # 08:50-20:59 KST, Mon-Fri (cron times are UTC). KRX now trades until
    # 20:00, and the Telegram summary sends as late as 19:40 KST, so this
    # needs to stay warm well past the old 15:59 cutoff or those late
    # sends risk a cold-start timeout.
    - cron: "50 23 * * 0-4"
    - cron: "*/10 0-11 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: curl -sf -o /dev/null -m 20 "https://market-dashboard-gqxq.onrender.com/" || true
